name: build-ipa-65343
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with xcodebuild (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Test.xcodeproj -scheme Test -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -40
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            echo "===== BUILD FAILED ====="
            grep -E "error" build.log | head -40
            exit 1
          fi
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Test.app" -path "*/Release-iphoneos/*" | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "no .app dir"; exit 1; fi
          test -f "$APP/Test" || { echo "NO BINARY in .app"; ls -la "$APP"; exit 1; }
          mkdir -p Payload
          cp -r "$APP" Payload/
          rm -rf Payload/Test.app/_CodeSignature 2>/dev/null || true
          zip -r test-65343.ipa Payload
          ls -la test-65343.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: test-65343-ipa
          path: test-65343.ipa